name: Daily Analytics Batch

on:
  schedule:
    # 21:30 UTC is 03:00 AM IST
    - cron: '30 21 * * *'
  workflow_dispatch:

jobs:
  run-batch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Daily Analytics Batch via Supabase RPC
        run: |
          curl -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/psyche_run_daily_batch" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json"
